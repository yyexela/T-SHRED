model:
  batch_size: 128
  coord_descent: none # True if rollout based model , false otherwise
  dataset: none # planetswe, sst, or plasma
  decoder: none # mlp or cnn
  decoder_depth: 1
  device: cuda:0
  delete_checkpoint: true
  dt: 1.0
  early_stop: 10
  encoder: none # "gru", "lstm", "sindy_loss_gru", "sindy_loss_lstm", "vanilla_transformer", "sindy_attention_transformer", "sindy_loss_transformer", "sindy_attention_sindy_loss_transformer", "sindy_attention_transformer_rollout", or "sindy_attention_sindy_loss_transformer_rollout"
  epochs: 100
  forecast_length: none # 1 for non rollout, 5 otherwise
  generate_loss_plots: false
  generate_test_plots: false
  generate_training_plots: false
  hidden_size: 20
  identifier: none
  input_length: 10
  n_heads: 4
  n_sensors: 5
  n_well_tracks: 10
  n_trials: 100
  poly_order: 1
  save_every_n_epochs: 10
  seed: none # 1 to 10
  sindy_attention_threshold_n_epochs: 10
  sindy_attention_threshold: 0.1
  sindy_loss_threshold: 0.1
  skip_load_checkpoint: true
  verbose: false

hyperparameters:
  encoder_depth:
    type: choice
    choices: [1, 2, 3]
  dropout:
    type: choice
    choices: [0.0, 0.1]
  lr:
    lower_bound: 1.0e-04
    type: loguniform
    upper_bound: 1.0e-01
  sindy_attention_weight:
    lower_bound: 1.0
    type: loguniform
    upper_bound: 10.0
  sindy_loss_weight:
    lower_bound: 1.0
    type: loguniform
    upper_bound: 10.0
  coord_descent_model_n_epochs:
    lower_bound: 1
    type: randint
    upper_bound: 10
  coord_descent_sindy_attention_n_epochs:
    lower_bound: 1
    type: randint
    upper_bound: 10
  coord_descent_model_lr:
    lower_bound: 1.0e-04
    type: loguniform
    upper_bound: 1.0e-01
  coord_descent_sindy_attention_lr:
    lower_bound: 1.0e-04
    type: loguniform
    upper_bound: 1.0e-01