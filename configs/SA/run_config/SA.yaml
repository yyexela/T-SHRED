model:
  batch_size: 128
  coord_descent: true
  coord_descent_model_lr: 1.00e-04
  coord_descent_model_n_epochs: 4
  coord_descent_sindy_attention_lr: 1.00e-02
  coord_descent_sindy_attention_n_epochs: 2
  dataset: sst
  decoder: mlp
